<div class="flex h-screen bg-gray-100 overflow-hidden" style="font-family: 'Inter', 'Segoe UI', sans-serif;">

  <!-- Mobile overlay -->
  @if (sidebarOpen) {
    <div class="fixed inset-0 bg-black/40 z-20 lg:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed lg:static inset-y-0 left-0 z-30 w-56 min-w-[224px] bg-white border-r border-gray-200 flex flex-col py-3 overflow-y-auto shrink-0 transition-transform duration-300"
    [class.-translate-x-full]="!sidebarOpen"
    [class.translate-x-0]="sidebarOpen"
    [class.lg:translate-x-0]="true"
  >
    <!-- Logo -->
    <div class="px-4 mb-5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center shrink-0">
          <span class="text-white font-bold text-sm">T</span>
        </div>
        <span class="font-semibold text-gray-800 text-sm">TitiShop</span>
      </div>
      <button (click)="closeSidebar()" class="lg:hidden text-gray-400 hover:text-gray-600">
        <i class="bi bi-x-lg text-sm"></i>
      </button>
    </div>

    <!-- Search -->
    <div class="px-3 mb-4">
      <div class="flex items-center gap-2 bg-gray-100 rounded-lg px-3 py-2 text-gray-400 text-sm cursor-pointer hover:bg-gray-200 transition-colors">
        <i class="bi bi-search text-sm"></i>
        <span>Buscar</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex flex-col gap-0.5 px-2 flex-1">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer"
        >
          <i class="bi {{item.icon}} text-sm shrink-0"></i>
          <span class="flex-1 truncate">{{ item.label }}</span>
          @if (item.hasArrow) {
            <i class="bi bi-chevron-right text-xs text-gray-300"></i>
          }
        </a>
      }

      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mt-5 mb-1 px-2.5">Configuración</p>
      @for (item of configItems; track item.label) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
          (click)="closeSidebar()"
          class="flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer"
        >
          <i class="bi {{item.icon}} text-sm shrink-0"></i>
          <span class="flex-1 truncate">{{ item.label }}</span>
          @if (item.hasArrow) {
            <i class="bi bi-chevron-right text-xs text-gray-300"></i>
          }
        </a>
      }
    </nav>

    <!-- User -->
    <div class="px-3 mt-4 pt-3 border-t border-gray-100">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0">
          <span class="text-indigo-600 text-sm font-bold">{{ userName[0] }}</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-700 truncate">{{ userName }}</p>
          <p class="text-xs text-gray-400 truncate">{{ userRole }}</p>
        </div>
        <button (click)="logout()" class="text-gray-400 hover:text-gray-600 transition-colors" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right text-sm"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <!-- Mobile topbar -->
    <div class="lg:hidden bg-white border-b border-gray-200 px-4 py-3 flex items-center gap-3 shrink-0">
      <button (click)="sidebarOpen = true" class="text-gray-500 hover:text-gray-700">
        <i class="bi bi-list text-xl"></i>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-indigo-500 flex items-center justify-center">
          <span class="text-white font-bold text-xs">T</span>
        </div>
        <span class="font-semibold text-gray-800 text-sm">TitiShop</span>
      </div>
    </div>
    <router-outlet />
  </div>

</div>
