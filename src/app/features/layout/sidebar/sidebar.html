<aside class="sidebar p-3 d-flex flex-column">
  <div class="brand mb-4">
    <div class="brand-icon mb-2">
      <i class="bi bi-bag-heart-fill"></i>
    </div>
    <h5 class="mb-0">TITI SHOP</h5>
    <small>Inventario interno</small>
  </div>

  <nav class="nav flex-column gap-1">
    @for (item of items; track item.path) {
      @if (canShow(item)) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link">
          <i [ngClass]="[item.icon, 'me-2']"></i>{{ item.label }}
        </a>
      }
    }
  </nav>

  <div class="sidebar-footer mt-auto pt-3">
    <div class="user-box mb-2">
      <div class="fw-semibold">{{ auth.session()?.fullName || 'Usuario sin sesión' }}</div>
      <small>{{ auth.session()?.role || 'Sin rol' }}</small>
    </div>
    <button class="btn btn-danger btn-sm w-100" (click)="logout()">
      <i class="bi bi-box-arrow-right me-1"></i>Salir
    </button>
  </div>
</aside>
