<section class="settings-page app-page">
  <header class="section-head">
    <div>
      <h1 class="page-title">Configuración del sistema</h1>
      <p class="page-subtitle">Administración de datos locales del sistema.</p>
    </div>
  </header>

  <article class="card p-3 p-md-4">
    <h5 class="panel-title mb-3">Restablecer sistema local</h5>
    <p class="text-secondary mb-3">
      Esta acción elimina los datos guardados en el navegador y cierra la sesión actual.
    </p>
    <button type="button" class="btn btn-danger" (click)="clearLocalData()">Limpiar localStorage y volver al login</button>
  </article>
</section>
