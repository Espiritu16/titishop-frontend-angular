<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card login-card p-0 overflow-hidden">
    <div class="row g-0">
      <div class="col-md-5 login-aside p-4">
        <div class="brand-mark mb-3"><i class="bi bi-bag-heart-fill"></i></div>
        <h3 class="mb-2">TITI SHOP PERU</h3>
        <p class="mb-0">Gestión moderna de inventario para operaciones internas.</p>
      </div>
      <div class="col-md-7 p-4 p-md-5">
        <h5 class="mb-1">Bienvenido</h5>
        <p class="text-secondary mb-4">Ingresa tus credenciales para continuar</p>
        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input [(ngModel)]="email" name="email" class="form-control" type="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input [(ngModel)]="password" name="password" class="form-control" type="password" required />
          </div>
          @if (error) {
            <div class="alert alert-danger py-2">{{ error }}</div>
          }
          @if (message) {
            <div class="alert alert-success py-2">{{ message }}</div>
          }
          <button class="btn btn-primary w-100" type="submit" [disabled]="!canSubmit">Ingresar al sistema</button>
        </form>
        <small class="d-block mt-3 text-secondary">Usuario demo: kevin@titishop.com / 123456</small>
      </div>
    </div>
  </div>
</div>
