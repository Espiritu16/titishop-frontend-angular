<header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 shrink-0">
  <div class="hidden lg:flex items-center gap-2 text-sm text-gray-400">
    <i class="bi bi-house"></i>
    <i class="bi bi-chevron-right text-xs"></i>
    <span class="text-gray-700 font-medium">Configuración</span>
  </div>
  <div class="lg:hidden text-sm font-semibold text-gray-800">Configuración</div>
</header>
<main class="flex-1 overflow-y-auto px-4 sm:px-6 py-5">
  <div class="mb-5">
    <h1 class="text-xl font-bold text-gray-800">Configuración</h1>
    <p class="text-sm text-gray-400 mt-0.5">Opciones del sistema</p>
  </div>
  <div class="max-w-md w-full">
    <div class="bg-white rounded-xl border border-red-100 p-4 sm:p-5">
      <div class="flex items-start gap-3 mb-4">
        <div class="w-9 h-9 rounded-lg bg-red-50 flex items-center justify-center shrink-0">
          <i class="bi bi-exclamation-triangle text-red-400"></i>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-gray-800">Restablecer sistema</h2>
          <p class="text-sm text-gray-400 mt-1 leading-relaxed">Esta acción eliminará todos los datos locales y no puede deshacerse.</p>
        </div>
      </div>
      <button class="w-full bg-red-500 hover:bg-red-600 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors">
        Limpiar datos del sistema
      </button>
    </div>
  </div>
</main>
